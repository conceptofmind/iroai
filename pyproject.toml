[project]
name = "hueshift-pixel"
version = "0.1.0"
description = "Hue-shifted pixel-art color ramps from hex colors or a reference image."
readme = "README.md"
authors = [
    { name = "Enrico Shippole", email = "enricoship@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
]

[project.scripts]
hueshift = "hueshift.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["hueshift"]